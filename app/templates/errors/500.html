{% extends "layouts/public.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="ch-error container">
  <div>
    <div class="ch-error-code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <a class="btn btn-primary" href="{{ url_for('main.landing') }}">Back to home</a>
      {% if current_user.is_authenticated %}<a class="btn btn-outline-secondary" href="{{ url_for(home_endpoint(current_user)) }}">My dashboard</a>
      {% else %}<a class="btn btn-outline-secondary" href="{{ url_for('auth.login') }}">Log in</a>{% endif %}
    </div>
  </div>
</div>
{% endblock %}
