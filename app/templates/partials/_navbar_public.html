{% from "components/macros.html" import brand %}
<header class="ch-navbar">
  <nav class="navbar navbar-expand-lg container ch-navbar-inner" aria-label="Main navigation">
    <a class="navbar-brand" href="{{ url_for('main.landing') }}" aria-label="CollegeHub home">{{ brand() }}</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
            data-bs-target="#publicNav" aria-controls="publicNav" aria-expanded="false"
            aria-label="Toggle navigation">
      <i class="bi bi-list fs-2"></i>
    </button>
    <div class="collapse navbar-collapse" id="publicNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-1">
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint in ('main.events','main.event_detail') }}" href="{{ url_for('main.events') }}">Events</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.landing') }}#features">Features</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.landing') }}#how-it-works">How it works</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('main.landing') }}#roles">Roles</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        {% if current_user.is_authenticated %}
          <a class="btn btn-primary btn-sm" href="{{ url_for(home_endpoint(current_user)) }}">
            <i class="bi bi-grid-1x2 me-1"></i>Dashboard</a>
          <form method="post" action="{{ url_for('auth.logout') }}" class="d-inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-outline-secondary btn-sm" type="submit">Sign out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('auth.login') }}">Log in</a>
          <a class="btn btn-primary btn-sm" href="{{ url_for('auth.register') }}">Create account</a>
        {% endif %}
      </div>
    </div>
  </nav>
</header>
